name: Deploy

on:
  workflow_dispatch:
  # Automatic triggers (push + weekly cron) disabled — deploying locally
  # instead via `make deploy` / `npm run localdeploy` to avoid any
  # dependency on GitHub Actions billing.

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    env:
      LOOKING_FOR_WORK: ${{ secrets.LOOKING_FOR_WORK_MODE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
      
      - name: Generate Daily Project with Gemini
        run: node src/assets/files/generateDailyProject.mjs
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Install LaTeX with resume dependencies
        if: env.LOOKING_FOR_WORK == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-fonts-extra

      - name: Download Resume
        if: env.LOOKING_FOR_WORK == 'true'
        run: node src/assets/files/downloadResume.js
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}

      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_PAGES_PAT }}
          REACT_APP_LOOKING_FOR_WORK: ${{ secrets.LOOKING_FOR_WORK_MODE }}

      - name: Discord Notify
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
             -d "{\"content\": \"🚀 Deployment Status: ${{ job.status }}\"}" \
             ${{ secrets.DISCORD_WEBHOOK }}
